[[mutant]]
id = "a-per-rule"
what = "(a) as one pass for BLB-1, then one for BLB-2 and BLB-3"
[[mutant.edit]]
file = "crates/chst-format/src/tables.rs"
old = '''        if blob.encoding != 0 {
            return Err(malformed(
                detail::BLOB_ENCODING,
                format!("blob {i}: encoding {} is not supported", blob.encoding),
            ));
        }
        if blob.stored_length != blob.raw_length {
            return Err(malformed(
                detail::BLOB_RAW_LENGTH,
                format!(
                    "blob {i}: stored blob of {} bytes has raw length {}",
                    blob.stored_length, blob.raw_length
                ),
            ));
        }
'''
new = ""
[[mutant.edit]]
file = "crates/chst-format/src/tables.rs"
old = '''        blobs.push(blob);
    }
'''
new = '''        blobs.push(blob);
    }
    for (i, blob) in blobs.iter().enumerate() {
        if blob.encoding != 0 {
            return Err(malformed(
                detail::BLOB_ENCODING,
                format!("blob {i}: encoding {} is not supported", blob.encoding),
            ));
        }
        if blob.stored_length != blob.raw_length {
            return Err(malformed(
                detail::BLOB_RAW_LENGTH,
                format!(
                    "blob {i}: stored blob of {} bytes has raw length {}",
                    blob.stored_length, blob.raw_length
                ),
            ));
        }
    }
'''

