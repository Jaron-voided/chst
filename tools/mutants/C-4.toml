id = "order-can2-before-blb7"
what = "CAN-2 before BLB-7"
file = "crates/chst-format/src/tables.rs"
old = '''    // (k) BLB-7: every blob is referenced by a file entry.
    let mut referenced: Vec<bool> = try_vec(blobs.len(), "blob flags")?;
    referenced.resize(blobs.len(), false);
