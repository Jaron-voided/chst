# Mutation suite for C-4: §13 step 10 (tables.rs) and the path rules (paths.rs).
# Rebuilt during C-5 from C-4's description in PROGRESS.md; C-4's own throwaway list was not kept.
# Run from the repository root: python3.14 -I tools/mutants/mutate.py tools/mutants/C-4.toml

build = "cargo test --locked --release --no-run -p chst-format -p chst-cli"

[commands]
unit = "cargo test --locked --release -p chst-format"
fixtures = 'CHST_LIM2=$(fixture_file fixtures/core/invalid/LIM-2.expect.json) cargo test --locked --release -p chst-cli --test task_reader -- reader_step_ reports'

